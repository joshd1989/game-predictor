name: Refresh data and deploy site

on:
  schedule:
    # 13:00 and 14:00 UTC cover 9:00 America/Toronto in EDT and EST.
    # 20:00 and 21:00 UTC cover 16:00 America/Toronto in EDT and EST.
    # scripts/should_refresh.py runs the pipeline only inside the local
    # morning and afternoon windows, and skips the second slot if a refresh
    # already landed within three hours.
    - cron: "0 13,14,20,21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "state/**"
      - "site/data.json"

permissions:
  contents: read

concurrency:
  group: game-predictor-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to refresh and deploy
        id: gate
        run: python3 scripts/should_refresh.py

      - name: Set up Python
        if: steps.gate.outputs.pipeline == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pipeline dependencies
        if: steps.gate.outputs.pipeline == 'true'
        run: pip install -r requirements.txt

      - name: Refresh data
        if: steps.gate.outputs.pipeline == 'true'
        run: |
          set -euo pipefail
          python3 gather.py
          python3 compact.py
          python3 - <<'PY'
          import json
          d = json.load(open("site/data.json", encoding="utf-8"))
          print("asOf", d.get("asOf"))
          for s in d.get("sources") or []:
              print(f"{s.get('id')}: {s.get('state')} @ {s.get('at')}")
          n = sum(len(v.get("games") or []) for v in (d.get("L") or {}).values())
          print("games", n)
          if n == 0:
              raise SystemExit("refusing to publish a slate with zero games")
          PY

      - name: Upload site
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Commit refreshed data
        if: steps.gate.outputs.pipeline == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json state/snapshots.json site/data.json
          if git diff --cached --quiet; then
            echo "Data unchanged."
          else
            git commit -m "Refresh predictor data"
            git push
          fi

  deploy:
    needs: refresh
    if: needs.refresh.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
